<script>
const W=800,H=450,cv=document.getElementById('c'),g=cv.getContext('2d');

['b450','b380 b580','g190,90 s330,40 b470','g200,100 b470 s620,40','b300 b440 s580,40 b680','g180,90 b420 s540,40 b660','g190,100 b350 s490,40 b570 s690,30'],
['f300','f250 f450','g200,100 f520','r s300,40 f450','r g190,100 f340 f560','r g180,90 s400,40 f480 b580','r g170,90 f330 s470,40 b560 f660'],
['P250,400 i300,330,60 i430,290,60 i560,330,60','P280,340 i320,340,60 i440,300,60 i540,340,50','g140,80 P340,320 i380,330,60 i490,290,60 i590,330,60','s250,40 P360,300 i400,330,60 i520,290,60 i610,330,40','b240 P380,290 i420,330,60 i530,290,60 i620,330,40','f220 P340,330 i380,330,60 i500,290,60 i600,330,50 s710,25','r g150,80 s320,40 P430,250 i460,330,60 i560,300,60']];

function gen(){
 const [m0,p0]=GEN[wl-5],mu=m0+(st%2&&wl===6?'H':st%2&&wl===7?'U':''),pl=p0+'X'+(wl>=9?'HU':''),r=rng(wl*131+st*17+7),nh=Math.min(4,2+((st+1)>>1));

 while(ty.length<nh)ty.push(pl[r()*pl.length|0]);

  if(sk){sk--;return}

function setSz(s){P.ts=s}

function build(){
 const tk=(wl<5?SP[wl][st]:gen()).split(' ').map(t=>[t[0],...t.slice(1).split(',').map(Number)]);

 const rr=rng(wl*977+st*31+3),hasR=tk.some(t=>t[0]==='r');

  if(k==='s'){o.push(K(x,378,y,22,id));tr.push({z:[x-60,x-30],a:[['show',id]]})}

  if(k==='U'||k==='H'){const up=k==='H';o.push({k:'z',x,y:380,w:30,h:20,on:1,up});tr.push({z:[x,x+30],rep:1,a:[['sz',up?1.7:.55]]});o.push(up?S(x+110,270,30,130):S(x+110,46,90,332));tr.push({z:[x+240,x+270],a:[['sz',1]]})}
  if(k==='X'){o.push(S(x,350,44,50));o.push(S(x+84,262,110,138))}
  if(k==='i')o.push(HS(x,y,w,12));

const taunts=['Really?','Trust nothing.','Floors lie.','Bold choice.','That was obvious.','So close. Not.','Ouch.'];
let wl=0,st=0,unl=1,sel=0,O,TR,P,title,deaths=0,dead=0,state='start',msg='',T=0,DB=[],PT=[],tz=null;
try{unl=Math.max(1,Math.min(15,+localStorage.getItem('td_unl')||1))}catch(e){}
sel=unl-1;
const keys={};
function load(){const d=build();O=d.o;TR=d.tr;title=wl===14?'Dungeon':'Level '+(wl+1);P={x:40,y:372,w:20,h:28,vx:0,vy:0,on:0,fl:1,sc:1,ts:1};dead=0;DB=[];PT=[]}
function pick(i){if(i>=unl)return;wl=i;st=0;deaths=0;tz=null;for(const k in keys)keys[k]=0;state='play';load()}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function die(){deaths++;dead=45;msg=taunts[deaths%taunts.length];for(let i=0;i<18;i++)PT.push({x:P.x+10,y:P.y+14,vx:(Math.random()-.5)*8,vy:-Math.random()*8,l:50,c:i%3?'#6f93d6':'#10131f'})}
function startTr(o){tz={ph:'close',t:0,door:o};P.vx=0}
function finish(){
 st++;
 if(st<7){load();tz={ph:'rev',t:0};return}
 unl=Math.max(unl,Math.min(15,wl+2));try{localStorage.setItem('td_unl',unl)}catch(e){}
 tz=null;sel=Math.min(wl+1,14);state=wl>=14?'win':'select';
}
function crumble(o){const n=Math.ceil(o.w/20),w=o.w/n;for(let i=0;i<n;i++)DB.push({x:o.x+i*w,y:o.y,w,h:o.h,vy:3,r:0,vr:(Math.random()-.5)*.2,d:0})}
function step(){
 T++;
 if(state!=='play')return;
 for(const d of DB){if(d.d>0){d.d--;continue}d.vy+=1.2;d.y+=d.vy;d.r+=d.vr}
 DB=DB.filter(d=>d.y<H+80);
 for(const p of PT){p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.l--}
 PT=PT.filter(p=>p.l>0);
 for(const o of O){if(o.sq>0)o.sq--;if(o.mw){o.t++;const v=Math.sin(6.283*(o.t+o.ph)/o.per);o.s=Math.max(0,Math.min(1,(v+.4)*3));o.y=46-354*o.s}}
 for(const o of O)if(o.tx!=null){const dx=o.tx-o.x,dy=o.ty-o.y,d=Math.hypot(dx,dy);if(d<=o.sp){o.x=o.tx;o.y=o.ty;o.tx=null}else{o.x+=dx/d*o.sp;o.y+=dy/d*o.sp}}
 if(tz){tz.t++;
  if(tz.ph==='close'){tz.door.c=Math.max(0,Math.min(1,(tz.t-14)/22));if(tz.t>=50){tz.ph='cover';tz.t=0}}
  else if(tz.ph==='cover'){if(tz.t>=28)finish()}
  else if(tz.t>=28)tz=null;
  return}
 if(dead){if(--dead===0)load();return}
 const m=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
 P.vx=m*4;if(m)P.fl=m;
 if(P.sc!==P.ts){const d=P.ts-P.sc;rsz(Math.abs(d)<.03?P.ts:P.sc+Math.sign(d)*.03)}
 if((keys.ArrowUp||keys.KeyW||keys.Space)&&P.on){P.vy=P.sc<.9?-9.6:P.sc>1.3?-13:-11;P.on=0}
 P.vy=Math.min(P.vy+.55,14);
 P.x=Math.max(0,Math.min(W-P.w,P.x+P.vx));
 for(const o of O)if(o.k==='s'&&o.on&&ov(P,o)){if(P.vx>0)P.x=o.x-P.w;else if(P.vx<0)P.x=o.x+o.w}
 P.y+=P.vy;P.on=0;
 for(const o of O)if(o.k==='s'&&o.on&&ov(P,o)){if(P.vy>0){P.y=o.y-P.h;P.on=1;o.seen=1}else P.y=o.y+o.h;P.vy=0}
 for(const o of O)if(o.k==='t'&&P.vy>=0&&ov(P,o)){P.vy=(keys.ArrowUp||keys.KeyW||keys.Space)?-20:-13;P.on=0;o.sq=8}

 for(const t of TR){

function bg(th){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,th.a);gr.addColorStop(1,th.b);g.fillStyle=gr;g.fillRect(0,0,W,H);

 g.fillStyle=th.h;for(const [x,r] of [[120,150],[420,200],[760,170]]){g.beginPath();g.ellipse(x,H,r,r*.6,0,Math.PI,0);g.fill()}
}

function startScreen(){
 const th=TH[0];bg(th);

const INK='#5b3d1e';

 }
});
cv.addEventListener('pointermove',e=>{
 if(state!=='select'||e.pointerType!=='mouse'){cv.style.cursor='';return}
 const h=hit(e);if(h>=0)sel=h;cv.style.cursor=h>=0&&h<unl?'pointer':'';
});
document.querySelectorAll('.pad button').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();
  if(state==='start'){state='select';return}
  if(state==='win'){menu();return}
  if(state!=='play')return;
  if(k==='Menu'){menu();return}
  keys[k]=1});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>{keys[k]=0}));
});
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=1000/60){step();acc-=1000/60}draw();requestAnimationFrame(loop)}
function fit(){
 const sg=document.getElementById('stage'),sc=Math.min(sg.clientWidth/W,sg.clientHeight/H);
 cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';
 const k=Math.max(1,Math.min(3,sc*(window.devicePixelRatio||1))),bw=Math.round(W*k);
 if(cv.width!==bw){cv.width=bw;cv.height=Math.round(H*k);SC=k;MAPC=null}
}
addEventListener('resize',fit);
fit();load();requestAnimationFrame(loop);
</script>
